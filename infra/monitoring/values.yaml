grafana:
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - grafana.lab

prometheus:
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - prometheus.lab
  prometheusSpec:
    retention: 3d
    resources:
      requests:
        memory: 512Mi
      limits:
        memory: 1Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi
    serviceMonitorSelectorNilUsesHelmValues: false

alertmanager:
  alertmanagerSpec:
    secrets:
      - gmail-smtp
  config:
    route:
      receiver: email
      group_by: ['alertname', 'namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: 'null'
          matchers:
            - alertname =~ "Watchdog|InfoInhibitor"
    receivers:
      - name: 'null'
      - name: email
        email_configs:
          - to: umuttvar1@gmail.com
            from: umuttvar1@gmail.com
            smarthost: smtp.gmail.com:587
            auth_username: umuttvar1@gmail.com
            auth_password_file: /etc/alertmanager/secrets/gmail-smtp/password
            require_tls: true
            send_resolved: true
            
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false