apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: demo-app
  namespace: {{ .Release.Namespace }}
spec:
  scaleTargetRef:            
    apiVersion: apps/v1
    kind: Deployment
    name: demo-app
  minReplicas: 2             
  maxReplicas: 5             
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50   