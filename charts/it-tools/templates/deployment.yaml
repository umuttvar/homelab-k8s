apiVersion: apps/v1
kind: Deployment
metadata:
  name: it-tool
  namespace: {{ .Release.Namespace }}
  
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: it-tool
  template:
    metadata:
      labels:
        app: it-tool
    spec:
      containers:
      - name: it-tool
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /
            port: 80
        livenessProbe:
          httpGet:
            path: /
            port: 80