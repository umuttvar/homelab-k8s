apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://metallb.github.io/metallb
      chart: metallb
      targetRevision: 0.16.1
      helm:
        releaseName: metallb
        valueFiles:
          - $values/infra/metallb/values.yaml

    - repoURL: https://github.com/umuttvar/homelab-k8s.git
      targetRevision: main
      ref: values

    - repoURL: https://github.com/umuttvar/homelab-k8s.git
      targetRevision: main
      path: infra/metallb
      directory:
        include: config.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: metallb-system