apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: local-path
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/umuttvar/homelab-k8s.git
    targetRevision: main
    path: infra/local-path  
  destination:
    server: https://kubernetes.default.svc
    namespace: local-path-storage